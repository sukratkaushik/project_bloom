<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Rangoli geometric corner ornament">
  <g fill="none" stroke="#F4A261" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.6">
    <!-- Quarter-arc rays from corner -->
    <path d="M0 200 Q 100 200 100 100"/>
    <path d="M0 200 Q 140 200 140 60"/>
    <path d="M0 200 Q 60 200 60 140"/>
    <!-- Diagonal petals -->
    <path d="M30 170 L 60 140"/>
    <path d="M60 140 L 100 100"/>
    <path d="M100 100 L 140 60"/>
    <!-- Anchor dots -->
    <g fill="#F4A261" stroke="none">
      <circle cx="60" cy="140" r="3"/>
      <circle cx="100" cy="100" r="3"/>
      <circle cx="140" cy="60" r="3"/>
      <circle cx="0" cy="200" r="4"/>
    </g>
    <!-- Lotus motif at the far point -->
    <g stroke="#F9C7D2">
      <path d="M140 60 C 130 40, 150 30, 160 50 Z"/>
      <path d="M140 60 C 130 70, 150 80, 160 60 Z"/>
      <path d="M140 60 C 120 50, 130 30, 150 30"/>
    </g>
    <!-- Trailing dots along the rays -->
    <g fill="#F4A261" stroke="none">
      <circle cx="40" cy="180" r="1.5"/>
      <circle cx="80" cy="160" r="1.5"/>
      <circle cx="120" cy="120" r="1.5"/>
      <circle cx="20" cy="190" r="1.5"/>
      <circle cx="50" cy="160" r="1.5"/>
      <circle cx="80" cy="120" r="1.5"/>
    </g>
  </g>
</svg>

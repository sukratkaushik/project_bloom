  <script type="text/javascript">
    // Polyfill to prevent React DOMException when Google Translate modifies text nodes
    if (typeof Node === 'function' && Node.prototype) {
      var origRemoveChild = Node.prototype.removeChild;
      Node.prototype.removeChild = function (child) {
        if (child.parentNode !== this) {
          return child;
        }
        return origRemoveChild.apply(this, arguments);
      };
      var origInsertBefore = Node.prototype.insertBefore;
      Node.prototype.insertBefore = function (newNode, referenceNode) {
        if (referenceNode && referenceNode.parentNode !== this) {
          return newNode;
        }
        return origInsertBefore.apply(this, arguments);
      };
    }

    // Pre-seed googtrans cookie from localStorage BEFORE Google Translate loads
    (function () {
      try {
        var savedLang = localStorage.getItem('bloom_selected_language');
        if (savedLang) {
          var cVal = savedLang === 'en' ? '/en/en' : ('/en/' + savedLang);
          document.cookie = 'googtrans=' + cVal + '; path=/; SameSite=Lax;';
          var hostname = window.location.hostname;
          if (hostname && !hostname.includes('localhost') && hostname.includes('.')) {
            document.cookie = 'googtrans=' + cVal + '; path=/; domain=' + hostname + '; SameSite=Lax;';
            var rootDomain = hostname.replace(/^www\./, '');
            if (rootDomain.includes('.')) {
              document.cookie = 'googtrans=' + cVal + '; path=/; domain=.' + rootDomain + '; SameSite=Lax;';
            }
          }
        }
      } catch (e) {}
    })();

    function googleTranslateElementInit() {
      try {
        new google.translate.TranslateElement(
          {
            pageLanguage: 'en',
            includedLanguages: 'en,hi,pa,gu,mr,bn,ta,kn,te,ml,ur,de',
            layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
            autoDisplay: false
          },
          'google_translate_element'
        );

        // Ensure .goog-te-combo matches the saved language
        try {
          var targetLang = localStorage.getItem('bloom_selected_language') || 'en';
          var attempts = 0;
          var syncInterval = setInterval(function () {
            attempts++;
            var combo = document.querySelector('.goog-te-combo');
            if (combo) {
              clearInterval(syncInterval);
              var desiredVal = targetLang === 'en' ? '' : targetLang;
              if (combo.value !== desiredVal) {
                combo.value = desiredVal;
                combo.dispatchEvent(new Event('change', { bubbles: true }));
              }
            } else if (attempts > 20) {
              clearInterval(syncInterval);
            }
          }, 150);
        } catch (e) {}
      } catch (e) {
        console.warn('Google Translate initialization:', e);
      }
    }
  </script>
  <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit" defer></script>
